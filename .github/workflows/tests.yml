name: check-in unit tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install requests pypushdeer
      - name: Run isolated tests (no secrets or external check-in calls)
        run: python -m unittest discover -s tests -v
